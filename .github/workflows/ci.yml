name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Un seul run par branche/PR : les pushs successifs annulent le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Gate anti-régression : toute la suite E2E doit être verte.
  # À déclarer comme "required status check" sur la branche main (voir README).
  # ----------------------------------------------------------------------------
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le serveur statique du test tourne sur python3 (déjà présent sur l'image).
      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Garde TDD : sur une PR vers main, un changement de logique de jeu
  # (public/js/, hors vendor) DOIT s'accompagner d'un changement dans tests/.
  # Contournement explicite et traçable : poser le label "skip-tdd-guard" sur la PR.
  # ----------------------------------------------------------------------------
  tdd-guard:
    name: Garde TDD (tests obligatoires)
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-tdd-guard')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Logique modifiée ⇒ test modifié
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE"
          CHANGED="$(git diff --name-only "origin/$BASE...HEAD")"
          echo "Fichiers modifiés dans la PR :"
          echo "$CHANGED" | sed 's/^/  - /'

          LOGIC="$(echo "$CHANGED" | grep -E '^public/js/' | grep -v '/vendor/' || true)"
          TESTS="$(echo "$CHANGED" | grep -E '^tests/' || true)"

          if [ -n "$LOGIC" ] && [ -z "$TESTS" ]; then
            echo "::error::La logique du jeu a changé (public/js/) sans aucun test associé (tests/)."
            echo "TDD : écris/mets à jour un test qui décrit le comportement attendu AVANT de coder."
            echo "Cas légitime sans test (refactor pur, etc.) ? Pose le label 'skip-tdd-guard' sur la PR."
            exit 1
          fi
          echo "✓ Garde TDD respectée."
